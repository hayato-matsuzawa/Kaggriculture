name: Kaggriculture V9 Anchor Compatibility

on:
  push:
    branches: [kaggriculture-v9-90pct]
    paths:
      - '.github/workflows/kaggriculture-v9-anchor-compat.yml'
      - 'research/v9_hybrid_eval.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kaggriculture-v9-anchor-compat.yml'
      - 'research/v9_hybrid_eval.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        anchor: [unseen_current, cok]
        suffix: [unseen_current, cok]
        decision: [1, 2, 4, 12, 24, 72]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kaggriculture-v9-90pct
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned environment
        run: python -m pip install 'kaggle-environments==1.32.7' requests
      - name: Evaluate bidirectional anchor/suffix pair
        run: |
          mkdir -p artifacts
          python research/v9_hybrid_eval.py \
            --anchor research/v9_screen/candidates/${{ matrix.anchor }}/main.py \
            --suffix research/v9_screen/candidates/${{ matrix.suffix }}/main.py \
            --suffix-name ${{ matrix.suffix }} \
            --decision ${{ matrix.decision }} \
            --groups newest_holdout \
            --cache artifacts/replays \
            --output artifacts/anchor-${{ matrix.anchor }}-suffix-${{ matrix.suffix }}-d${{ matrix.decision }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v9-anchor-${{ matrix.anchor }}-${{ matrix.suffix }}-d${{ matrix.decision }}
          path: artifacts/anchor-${{ matrix.anchor }}-suffix-${{ matrix.suffix }}-d${{ matrix.decision }}.json
          retention-days: 7
