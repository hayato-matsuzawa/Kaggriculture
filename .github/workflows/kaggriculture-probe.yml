name: Kaggriculture API Probe

on:
  push:
    branches: [kaggriculture-v8-research]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe replay endpoints
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import requests

          episode_id = 94450041
          tests = [
              ('GET_REST', 'GET', f'https://api.kaggle.com/api/v1/competitions/episodes/{episode_id}/replay', None),
              ('GET_RPC', 'GET', f'https://api.kaggle.com/v1/competitions.CompetitionApiService/GetEpisodeReplay?episodeId={episode_id}', None),
              ('POST_RPC_CAMEL', 'POST', 'https://api.kaggle.com/v1/competitions.CompetitionApiService/GetEpisodeReplay', {'episodeId': episode_id}),
              ('POST_RPC_SNAKE', 'POST', 'https://api.kaggle.com/v1/competitions.CompetitionApiService/GetEpisodeReplay', {'episode_id': episode_id}),
              ('PUBLIC_REPLAY', 'GET', f'https://www.kaggle.com/competitions/episodes/{episode_id}/replay.json', None),
              ('KAGGLEUSERCONTENT', 'GET', f'https://www.kaggleusercontent.com/episodes/{episode_id}.json', None),
          ]
          for name, method, url, payload in tests:
              try:
                  response = requests.request(method, url, json=payload, timeout=30, allow_redirects=True)
                  print(f'\n=== {name} ===')
                  print('status', response.status_code)
                  print('url', response.url)
                  print('content-type', response.headers.get('content-type'))
                  print('length', len(response.content))
                  print('head', response.text[:1000])
              except Exception as exc:
                  print(f'\n=== {name} ERROR ===')
                  print(type(exc).__name__, repr(exc))
          PY
