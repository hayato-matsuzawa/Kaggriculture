name: Kaggriculture V21 Cross-Era Benchmark

on:
  push:
    branches: [kaggriculture-v8-research]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned current environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kaggle-environments==1.32.7' requests
      - name: Fetch audited public V21 candidate
        run: |
          mkdir -p artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/Seyamalam/Kaggriculture/main/main.py \
            -o artifacts/v21_main.py
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/Seyamalam/Kaggriculture/main/THIRD_PARTY_NOTICES.md \
            -o artifacts/THIRD_PARTY_NOTICES.md
          echo '0cd14b653102d276c4f902fa3b8c6bd81d869b8ab64c422cb881b9d2346ec639  artifacts/v21_main.py' | sha256sum -c -
          python -m py_compile artifacts/v21_main.py
      - name: Run cross-era replay benchmark
        run: |
          python research/benchmark_v21.py \
            --candidate artifacts/v21_main.py \
            --cache artifacts/replays \
            --output artifacts/v21-benchmark.json \
            --markdown artifacts/v21-benchmark.md
      - name: Package candidate
        run: |
          mkdir -p artifacts/submission
          cp artifacts/v21_main.py artifacts/submission/main.py
          tar -C artifacts/submission -czf artifacts/kaggriculture_v21_current_env.tar.gz main.py
          tar -tzf artifacts/kaggriculture_v21_current_env.tar.gz
          sha256sum artifacts/kaggriculture_v21_current_env.tar.gz | tee artifacts/submission-sha256.txt
      - name: Upload benchmark and submission
        uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-v21-current-env
          path: |
            artifacts/kaggriculture_v21_current_env.tar.gz
            artifacts/v21_main.py
            artifacts/v21-benchmark.json
            artifacts/v21-benchmark.md
            artifacts/submission-sha256.txt
            artifacts/THIRD_PARTY_NOTICES.md
          retention-days: 7
