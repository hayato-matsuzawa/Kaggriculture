name: Kaggriculture V10 Channel Screen

on:
  push:
    branches: [kaggriculture-v10-85pct]
    paths:
      - '.github/workflows/kaggriculture-v9-channel-screen.yml'
      - 'research/v9_channel_eval.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kaggriculture-v9-channel-screen.yml'
      - 'research/v9_channel_eval.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kaggriculture-v10-85pct
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official environment
        run: python -m pip install 'kaggle-environments==1.32.7' requests
      - name: Prefetch untouched newest holdout
        run: |
          mkdir -p artifacts/replays artifacts/channel
          PYTHONPATH=research python - <<'PY'
          from pathlib import Path
          import benchmark_v21 as b
          cache=Path('artifacts/replays')
          for ep in b.EPISODE_GROUPS['newest_holdout']:
              b.download_replay(ep,cache)
          print('prefetched',len(b.EPISODE_GROUPS['newest_holdout']))
          PY
      - name: Evaluate all worker-market compositions in parallel
        shell: bash
        run: |
          set -euo pipefail
          names=(unseen_current cok sota_claude)
          pids=()
          for worker in "${names[@]}"; do
            for market in "${names[@]}"; do
              echo "launch $worker / $market"
              PYTHONPATH=research python research/v9_channel_eval.py \
                --worker "research/v9_screen/candidates/$worker/main.py" \
                --market "research/v9_screen/candidates/$market/main.py" \
                --worker-name "$worker" \
                --market-name "$market" \
                --groups newest_holdout \
                --cache artifacts/replays \
                --output "artifacts/channel/channel-$worker-$market.json" \
                > "artifacts/channel/channel-$worker-$market.log" 2>&1 &
              pids+=("$!")
            done
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          for f in artifacts/channel/*.log; do
            echo "===== $f ====="
            tail -n 40 "$f"
          done
          exit "$status"
      - name: Rank compositions
        if: always()
        run: |
          python - <<'PY'
          import glob,json,pathlib
          rows=[]
          for p in glob.glob('artifacts/channel/*.json'):
              d=json.load(open(p));s=d['summary']['newest_holdout']
              rows.append({'worker':d['worker'],'market':d['market'],**s,'path':p})
          rows.sort(key=lambda r:(r['wins'],r['mean_margin'],r['min_margin']),reverse=True)
          out={'qualification_wins_required':23,'qualified':[r for r in rows if r['wins']>=23 and r['valid']==26],'ranking':rows}
          pathlib.Path('artifacts/channel/summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggriculture-v10-channel-screen
          path: artifacts/channel
          retention-days: 7
