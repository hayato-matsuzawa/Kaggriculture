name: Kaggriculture V9 Channel Screen

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kaggriculture-v9-channel-screen.yml'
      - 'research/v9_channel_eval.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        worker: [unseen_current, cok, sota_claude]
        market: [unseen_current, cok, sota_claude]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kaggriculture-v9-90pct
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'kaggle-environments==1.32.7' requests
      - name: Evaluate channel composition
        run: |
          mkdir -p artifacts
          python research/v9_channel_eval.py \
            --worker research/v9_screen/candidates/${{ matrix.worker }}/main.py \
            --market research/v9_screen/candidates/${{ matrix.market }}/main.py \
            --worker-name ${{ matrix.worker }} \
            --market-name ${{ matrix.market }} \
            --groups newest_holdout \
            --cache artifacts/replays \
            --output artifacts/channel-${{ matrix.worker }}-${{ matrix.market }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: v9-channel-${{ matrix.worker }}-${{ matrix.market }}
          path: artifacts/channel-${{ matrix.worker }}-${{ matrix.market }}.json
          retention-days: 7
