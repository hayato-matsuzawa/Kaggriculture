name: Kaggriculture Market Blend Evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/market-blend-trigger.txt'
      - 'research/benchmark_v21.py'
      - 'research/v10_market_blend_eval.py'
      - '.github/workflows/kaggriculture-market-blend-eval.yml'

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official environment
        run: python -m pip install 'kaggle-environments==1.32.7' requests
      - name: Fetch candidates and replays
        run: |
          mkdir -p artifacts/candidates artifacts/replays artifacts/results
          curl -L --fail --retry 3 https://raw.githubusercontent.com/UnseenAnchor/Kaggriculture-Kaggle/main/submission/main.py -o artifacts/candidates/unseen.py
          curl -L --fail --retry 3 https://raw.githubusercontent.com/COK-ZhangZiliang/Kaggriculture/main/main.py -o artifacts/candidates/cok.py
          curl -L --fail --retry 3 https://raw.githubusercontent.com/sota1111/kaggriculture-claude/main/main.py -o artifacts/candidates/sota.py
          python -m py_compile artifacts/candidates/*.py
          PYTHONPATH=research python - <<'PY'
          from pathlib import Path
          import benchmark_v21 as b
          for ep in b.EPISODE_GROUPS['newest_holdout']:
              b.download_replay(ep, Path('artifacts/replays'))
          PY
      - name: Evaluate bounded sale overlays
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/jobs.txt <<'EOF'
          unseen cok replace 72
          unseen cok max 72
          unseen cok replace 432
          unseen cok max 432
          unseen sota replace 72
          unseen sota max 72
          cok unseen replace 72
          cok unseen max 72
          cok unseen replace 432
          cok unseen max 432
          cok sota replace 72
          cok sota max 72
          EOF
          cat artifacts/jobs.txt | xargs -n4 -P3 bash -c '
            base="$0"; overlay="$1"; mode="$2"; step="$3";
            PYTHONPATH=research python research/v10_market_blend_eval.py \
              --base "artifacts/candidates/${base}.py" --overlay "artifacts/candidates/${overlay}.py" \
              --base-name "$base" --overlay-name "$overlay" --mode "$mode" --decision-step "$step" \
              --groups newest_holdout --cache artifacts/replays \
              --output "artifacts/results/${base}__${overlay}__${mode}__${step}.json" \
              > "artifacts/results/${base}__${overlay}__${mode}__${step}.log" 2>&1
          '
      - name: Summarize
        run: |
          python - <<'PY'
          import glob,json,pathlib
          rows=[]
          for p in glob.glob('artifacts/results/*.json'):
              d=json.load(open(p)); s=d['summary']['newest_holdout']
              rows.append({'base':d['base'],'overlay':d['overlay'],'mode':d['mode'],'decision_step':d['decision_step'],**s})
          rows.sort(key=lambda x:(x['wins'],x['mean_margin'],x['min_margin']),reverse=True)
          out={'gate_wins':23,'qualified':rows[0]['wins']>=23,'best':rows[0],'all':rows}
          pathlib.Path('artifacts/summary.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-market-blend-eval
          path: artifacts
          retention-days: 7
